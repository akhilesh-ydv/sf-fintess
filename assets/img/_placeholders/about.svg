<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Trainer portrait placeholder">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d23"/>
      <stop offset="60%" stop-color="#111114"/>
      <stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <radialGradient id="aspot" cx="50%" cy="32%" r="58%">
      <stop offset="0" stop-color="#5c5c68" stop-opacity=".5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="afig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a44"/>
      <stop offset="1" stop-color="#14141a"/>
    </linearGradient>
    <filter id="agrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="asoft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="800" height="1000" fill="url(#abg)"/>
  <rect width="800" height="1000" fill="url(#aspot)"/>

  <!-- wall panels -->
  <g stroke="#232329" stroke-width="6" opacity=".7">
    <path d="M100 0 V1000 M300 0 V1000 M500 0 V1000 M700 0 V1000"/>
  </g>

  <!-- accent bar -->
  <rect x="0" y="640" width="800" height="6" fill="#ff1f45" opacity=".35"/>

  <!-- seated figure silhouette -->
  <g fill="url(#afig)">
    <ellipse cx="400" cy="880" rx="230" ry="34" fill="#000" opacity=".6" filter="url(#asoft)"/>
    <!-- head -->
    <circle cx="400" cy="300" r="58"/>
    <!-- torso -->
    <path d="M400 360 c72 0 118 44 126 116 l14 128 c4 34 -18 56 -52 56 h-176 c-34 0 -56 -22 -52 -56 l14 -128 c8 -72 54 -116 126 -116 z"/>
    <!-- arms -->
    <path d="M292 400 c-40 26 -58 74 -60 132 l-4 108 c-1 22 30 26 36 4 l30 -112 z"/>
    <path d="M508 400 c40 26 58 74 60 132 l4 108 c1 22 -30 26 -36 4 l-30 -112 z"/>
    <!-- legs -->
    <path d="M336 656 h56 l-10 200 c-2 26 -52 26 -54 0 z"/>
    <path d="M408 656 h56 l8 200 c2 26 -48 26 -54 0 z"/>
  </g>

  <!-- rim light -->
  <g fill="none" stroke="#ff1f45" stroke-width="5" opacity=".55">
    <path d="M458 300 a58 58 0 0 0 -58 -58"/>
    <path d="M526 476 c8 -34 -2 -60 -18 -76"/>
  </g>

  <rect width="800" height="1000" filter="url(#agrain)" opacity=".08"/>
</svg>
